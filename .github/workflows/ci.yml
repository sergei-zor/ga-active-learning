name: CI

on:
    push:
    pull_request:

jobs:
    smoke-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5 
              with:
                python-version: "3.10"
            - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
            - run: python train_model.py --smoke_test